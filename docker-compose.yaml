
# Local development stack: PostgreSQL + the FastAPI backend.
#   docker compose up -d db        # just the database
#   docker compose up              # database + API
# The schema + seed are applied automatically on first DB start via the
# mounted init scripts (Postgres runs *.sql in /docker-entrypoint-initdb.d).
version: "3.9"

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: plantrack
      POSTGRES_PASSWORD: plantrack
      POSTGRES_DB: plantrack
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/migrations/0001_initial_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./db/seeds/0001_sample_data.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plantrack"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://plantrack:plantrack@db:5432/plantrack
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build: ./backend
    command: celery -A app.jobs.celery_app.celery_app worker --loglevel=info
    environment:
      DATABASE_URL: postgresql+psycopg://plantrack:plantrack@db:5432/plantrack
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  pgdata: